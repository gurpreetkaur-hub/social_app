name: Flutter CI Practice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: 'stable'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 4: Analyze code
      - name: Analyze code
        run: flutter analyze

      # Step 5: Run tests
      - name: Run tests
        run: flutter test

      # Step 6: Build debug APK (no keystore needed!)
      - name: Build debug APK
        run: flutter build apk --debug

      # Step 7: Save APK so you can download it
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk